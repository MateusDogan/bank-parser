spring:
  application:
    name: bank-parser

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bankparser}
    username: ${POSTGRES_USER:bankparser_user}
    password: ${POSTGRES_PASSWORD:bankparser_pass}

  jpa:
    # O schema e propriedade do Flyway; o Hibernate so confere se bate.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # O default do Spring e 1MB e rejeitaria extratos reais.
      max-file-size: 25MB
      max-request-size: 25MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET_STATEMENTS:bank-statements}

server:
  port: 8080

logging:
  level:
    com.bankparser: DEBUG
