version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bankparser-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankparser}
      POSTGRES_USER: ${POSTGRES_USER:-bankparser_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankparser_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankparser_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bankparser-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bankparser.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: bankparser-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A API (Spring Boot) sera adicionada na Fase 3, apos o parser (Fase 0/1)
  # e a infraestrutura de dados (Fase 2) estarem prontas.
  # api:
  #   build: ./backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankparser}
  #     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankparser_user}
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bankparser_pass}
  #     MINIO_ENDPOINT: http://minio:9000
  #     MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy

volumes:
  postgres_data:
  minio_data:
